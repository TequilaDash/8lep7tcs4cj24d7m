[package]
name = "idevice-ffi"
version = "0.1.0"
edition = "2024"


[dependencies]
# Lua 模块宿主（v0.3.95：Rust+mlua 解释器，编进 App；单一 Rust 静态库避免
# 重复 std 符号）。mlua vendored = 编译捆绑的 Lua 5.4 C 源码，需 CC 指向 iOS SDK。
mlua = { version = "0.9", features = ["lua54", "vendored", "send"] }
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "26a28f6a46b5d85a28043c2e62febfa394c8b0a6", default-features = false }
futures = { version = "0.3", optional = true }
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing-appender = { version = "0.2" }
once_cell = "1.21.1"
tokio = { version = "1.44.1", features = ["full"] }
libc = "0.2.171"
plist = "1.7.1"
plist_ffi = { version = "0.1.6" }
uuid = { version = "1.12", features = ["v4"], optional = true }
serde_json = { version = "1", optional = true }
mdns-sd = { version = "0.19", optional = true }
# Apple ID 登录 + IPA 签名（IPA 侧载用）。移植自 SideInstaller 的 rust-core，
# 仅使用其 sign-only 路径（Sideloader::sign_app，不接触设备）。
# 注意：isideload 无条件引用 crates.io 的 idevice 0.1.61（install feature-gate
# 不完整），与上面的 git idevice 0.1.63 作为两个独立版本共存（符号不同，
# 无链接冲突）——SideInstaller 已验证同一组合。
# v0.2.111+：改用 AmorCool 的 fork（上游 nab138/isideload @86b2540 + 一个提交），
# 唯一改动是给 `DeveloperSession` 增加公开的 `get_adsid()` / `get_token()`，
# 用于把 dsid + xcode.auth token 暴露给 Swift 持久化，实现 IPA 登录免重复登录。
# 上游把这两个字段设为私有，无法从外部读取。
isideload = { git = "https://github.com/AmorCool/isideload.git", rev = "8ba0ec4a6750dd0ff11e152efb2c39e6dd302632", package = "isideload", default-features = false, features = [
  "install",
  "fs-storage",
] }
# rustls 显式依赖：我们的 default features 是 ring，而 isideload 依赖链
# （reqwest 0.13 rustls-tls）会启用 aws-lc-rs —— 两个 provider feature 同时开
# 导致 rustls 运行时报 "Could not automatically determine the process-level
# CryptoProvider"（v0.2.83 真机实锤）。在 FFI 入口显式 install_default 选择
# ring provider 绕过自动检测。
rustls = { version = "0.23", features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[features]
aws-lc = ["idevice/aws-lc"]
ring = ["idevice/ring"]
rustcrypto = ["idevice/rustcrypto"]
openssl = ["idevice/openssl"]


afc = ["idevice/afc"]
amfi = ["idevice/amfi"]
bt_packet_logger = ["idevice/bt_packet_logger"]
companion_proxy = ["idevice/companion_proxy"]
core_device = ["idevice/core_device", "dep:futures", "dep:uuid", "rsd"]
core_device_proxy = ["idevice/core_device_proxy", "idevice/tunnel_tcp_stack"]
crashreportcopymobile = ["idevice/crashreportcopymobile", "afc"]
cryptexd = ["idevice/cryptexd", "rsd", "tss"]
debug_proxy = ["idevice/debug_proxy"]
diagnostics_relay = ["idevice/diagnostics_relay"]
dvt = ["idevice/dvt"]
device_info = ["idevice/device_info"]
application_listing = ["idevice/application_listing"]
condition_inducer = ["idevice/condition_inducer"]
energy_monitor = ["idevice/energy_monitor"]
graphics = ["idevice/graphics"]
network_monitor = ["idevice/network_monitor"]
sysmontap = ["idevice/sysmontap"]
heartbeat = ["idevice/heartbeat"]
notification_proxy = ["idevice/notification_proxy"]
house_arrest = ["idevice/house_arrest", "afc"]
installcoordination_proxy = ["idevice/installcoordination_proxy", "rsd"]
installation_proxy = ["idevice/installation_proxy"]
springboardservices = ["idevice/springboardservices"]
misagent = ["idevice/misagent"]
mobileactivationd = ["idevice/mobileactivationd"]
mobilebackup2 = ["idevice/mobilebackup2"]
mobile_image_mounter = ["idevice/mobile_image_mounter"]
location_simulation = ["idevice/location_simulation"]
pair = ["idevice/pair"]
pcapd = ["idevice/pcapd"]
preboard_service = ["idevice/preboard_service"]
obfuscate = ["idevice/obfuscate"]
restore = ["idevice/restore", "dep:futures"]
restore_recovery = ["restore", "idevice/restore_recovery"]
restore_service = ["idevice/restore_service", "rsd"]
remote_pairing = ["idevice/remote_pairing", "dep:mdns-sd"]
rsd = ["idevice/rsd"]
syslog_relay = ["idevice/syslog_relay"]
tcp = ["idevice/tcp"]
tunnel_tcp_stack = [
  "idevice/tunnel_tcp_stack",
  "core_device_proxy",
  "rsd",
  "remote_pairing",
]
tunnel_tcp_stack_pcap = ["idevice/tunnel_tcp_stack_pcap", "tunnel_tcp_stack"]
tss = ["idevice/tss"]
tunneld = ["idevice/tunneld"]
usbmuxd = ["idevice/usbmuxd", "dep:futures"]
wda = ["idevice/wda", "dep:serde_json"]
xpc = ["idevice/xpc"]
screenshotr = ["idevice/screenshotr"]
full = [
  "afc",
  "amfi",
  "bt_packet_logger",
  "companion_proxy",
  "core_device",
  "core_device_proxy",
  "crashreportcopymobile",
  "cryptexd",
  "debug_proxy",
  "diagnostics_relay",
  "dvt",
  "device_info",
  "application_listing",
  "condition_inducer",
  "energy_monitor",
  "graphics",
  "network_monitor",
  "sysmontap",
  "heartbeat",
  "house_arrest",
  "installcoordination_proxy",
  "installation_proxy",
  "location_simulation",
  "misagent",
  "mobileactivationd",
  "mobile_image_mounter",
  "mobilebackup2",
  "notification_proxy",
  "pair",
  "pcapd",
  "preboard_service",
  "restore",
  "restore_recovery",
  "restore_service",
  "remote_pairing",
  "rsd",
  "screenshotr",
  "springboardservices",
  "syslog_relay",
  "tcp",
  "tunnel_tcp_stack",
  "tss",
  "tunneld",
  "usbmuxd",
  "wda",
  "xpc",
]
default = ["full", "ring"]

[build-dependencies]

[lib]
crate-type = ["staticlib"]
