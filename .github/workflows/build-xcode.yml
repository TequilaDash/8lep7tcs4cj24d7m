name: Build Xcode (Plan A dual-track)

# 方案 A 双轨迁移脚手架：在不碰 Theos 的前提下，用 xcodegen + xcodebuild 验证
# 当前源码能否在 Xcode 原生工程下编译/链接，并产出与 Theos 同形态的【未签名 IPA】。
# 出包方式对齐 Theos 链路（Payload/TequilaDash.app → zip），但 Xcode 轨道直接出【未签名 IPA】：
# 不调用 ldid（brew 版 ldid 在 CI 上对主二进制 assert 崩溃 ldid.cpp(852)，且用户明确产物不需签名）。
# entitlements 文件随 .app 携带，供侧载工具（Sideloadly/ESign/TrollStore）施加。全程不依赖 Apple 证书。
#
# 触发：只由 v* tag 触发（或手动 workflow_dispatch）。
# 默认出包轨道：日常在 migrate-xcode 分支开发（不再自动构建，避免重复跑），打 vX.Y.Z tag 后
# 由本工作流在【一条 action 内】完成「构建 → 出未签名 IPA → 发 Release」。
# 复用 tequiladash-build-cache scope 下已建好的 Rust/Cargo/sccache 缓存。

on:
  push:
    # 只由 tag 触发：打 vX.Y.Z 即「构建 + 出包 + 发 Release」在同一条 action 内一次完成。
    # 此前同时监听 migrate-xcode 分支，导致「先推分支、再推 tag」会跑两条内容完全相同的
    # 构建（各 15~30 分钟），纯粹浪费 CI 且第一条失败后第二条必然同样失败。现去掉分支触发，
    # 日常提交不再自动构建；如需临时验证用 workflow_dispatch 手动触发。
    #
    # ★★ 发版流程（2026-10-10 定，照做可省掉一次全量构建）★★
    #
    #   正确顺序 —— 版本号在「验证」之前就改好：
    #     ① 改 MARKETING_VERSION / CURRENT_PROJECT_VERSION / CHANGELOG
    #     ② commit + push
    #     ③ gh workflow run build-xcode.yml --ref migrate-xcode     ← 验证（这一次真构建）
    #     ④ 验证绿了 ⇒ git tag vX.Y.Z <同一个 commit> && git push origin vX.Y.Z
    #        ⇒ tag 那次会命中「同 headSha 的 success run + hash 一致」⇒ 复用产物 ⇒ 秒级出包
    #
    #   错误顺序 —— 会白跑一次全量构建（各 8~11 分钟）：
    #     ✗ 先 workflow_dispatch 验证 → 再改版本号 → 再 tag
    #       （改版本号改了 project.yml 的 blob ⇒ CUR_HASH 变 ⇒ tag 那次 hash 对不上 ⇒ 只能全量重建）
    #
    #   复用判据在 xcode-build 的 REUSE 段：同 headSha + success + artifact 未过期 +
    #   产物内 promote-hash.txt 与本次 CUR_HASH 一致。四条件全满足才跳过编译。
    #   CUR_HASH = `git ls-tree -r HEAD -- TequilaDash TequilaDashTunnel project.yml | shasum -a 256`
    #   —— 含 project.yml 完整 blob，故改版本号必变；这正是「验证后改号」无法复用的原因。
    #   完整机制与优化 B（改 CI 让 hash 忽略版本号）的取舍见 docs/releasing.md §3b 与
    #   简报《优化_消除重复构建.md》。
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # 跨 run 产物缓存需要读 artifacts API（actions/cache 按 tag scope 隔离，
  # tag 触发的 run 保存的缓存下一个 tag 永远取不到——2026-08-31 五连 miss 实锤）
  actions: read

jobs:
  # ── 防复发静态检查（guard）────────────────────────────────────────────────────
  # 把「视图层各自推导下载状态文案 / 顶层类型重名」这类**只有全量编译或人工 review 才
  # 发现**的问题，挡在发版之前。脚本纯标准库、秒级跑完，故**独立成一个轻量 job**：
  # 不拖慢 8~11 分钟的 xcode-build，且失败信号独立清晰（不再混在编译日志里）。
  # ⚠️ 它失败必须**阻止发版**：Release 有两条发布路径 —— promote（复用产物时）与
  #    xcode-build 末尾的 Publish Release 步骤 —— 两处都门控在 guard 成功上（见各自 needs）。
  guard:
    # 与其它 job 同 runner label（自建镜像 xcode-27）；写成 ubuntu-latest 不保证有机器。
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — 视图层状态文案推导 + 顶层类型重名（防复发）
        # 统一入口依次跑两项检查（与本地 `python3 Resources/Scripts/swift_precommit_check.py .` 同口径）：
        #   1) swift_top_level_type_collision.py —— 顶层类型重名（`swiftc -parse` 单文件解析查不出）
        #   2) swift_view_state_derivation.py    —— 视图层「自行推导下载状态文案」
        # 退出码：0 = 通过；非 0 = 有 ERROR（默认 R1/R2/R4/R5 致命，R3 为 WARN 不致命）。
        run: python3 Resources/Scripts/swift_precommit_check.py .

  # ── 转正判定（promote）────────────────────────────────────────────────────────
  # tag 触发时先查：同一 commit SHA 是否已有一次「成功构建」，且其 IPA artifact
  # 仍在保留期内、且源码 hash 一致。四条全满足 ⇒ 直接复用那次产物发 Release，
  # 下面的 xcode-build 被 job 级 if 整体跳过 —— 不再重复烧一遍 15~30 分钟的编译。
  # 任一条不确定 ⇒ 老实重新构建（宁可多编一次，不发错产物）。
  # 用独立 job 做门控（而非给每个 build step 加 if）：job 级 if 是原子的，
  # 不可能出现「漏给某个 step 加 if ⇒ 半跳过 ⇒ 编译中途失败」。
  promote:
    # 门控：防复发检查（guard）不过就不转正 —— 「发版前拦住」是 guard 存在的意义。
    needs: [guard]
    # 与 xcode-build 同 runner label：本仓库用的是自建镜像标签（xcode-27），
    # 写成 ubuntu-latest 不保证有机器，风险是永久排队。
    runs-on: xcode-27
    permissions:
      contents: write   # 复用成功时要发 Release
      actions: read     # 读 runs / artifacts API（gh run list / gh api .../artifacts）
    outputs:
      reuse: ${{ steps.resolve.outputs.reuse }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve reusable build (promote tag without rebuilding)
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 只对 v* tag 做转正判定；workflow_dispatch 一律正常构建。
          case "${GITHUB_REF:-}" in
            refs/tags/v*) ;;
            *)
              echo "非 v* tag 触发（ref=${GITHUB_REF:-}），跳过复用判定，走正常构建。"
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              { echo "### Promote 判定：未复用"
                echo "- ref = \`${GITHUB_REF:-}\`（非 v* tag）⇒ 正常构建，不做复用。"; } >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
          esac

          SHA="${GITHUB_SHA}"
          echo "tag=${GITHUB_REF_NAME} sha=${SHA}"

          # 本次提交树里「参与编译的路径」的内容 hash。与 xcode-build 写入 artifact 的
          # promote-hash.txt 用同一条命令；git ls-tree 只读提交树、与工作区状态无关，
          # 因此两个 job 各自算出的值天然可比。
          # 注：TequilaDashTunnel 是 Phase 2 新增的扩展源码目录（不在 TequilaDash/ 下），
          # 必须一并纳入，否则「只改扩展源码」的提交会与旧产物 hash 相同 ⇒ 误判可复用。
          # 与 xcode-build job 共用同一脚本（原先两处各写一遍同一条 git ls-tree，
          # 只覆盖 TequilaDash / TequilaDashTunnel / project.yml，实测漏掉 7 类真实构建输入：
          # Resources/Info.plist（版本号就在里面）、两个 entitlements、BundledModules、
          # ZSign、vendor、Resources/Scripts —— 只改这些 + 打 tag 会算出相同 hash，
          # 导致 promote 复用旧 IPA 发 Release，而 Release 挂的是新 tag）。
          CUR_HASH="$(bash Resources/Scripts/promote_hash.sh)"
          echo "current source hash: $CUR_HASH"

          REUSE=false
          # 找同 SHA 的 success run（新→旧），逐个验证 artifact 存在 / 未过期 / hash 一致。
          RUNS="$(gh run list --workflow build-xcode.yml -L 100 \
            --json databaseId,headSha,conclusion \
            --jq "[.[] | select(.headSha == \"${SHA}\" and .conclusion == \"success\")] | .[].databaseId" \
            2>/dev/null || true)"
          echo "同 SHA 的 success run: ${RUNS:-<无>}"

          for RUN in ${RUNS:-}; do
            # 判据 1：artifact 必须存在且【未过期】（保留期过了 gh 取不到）。
            ART="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}/artifacts" \
              --jq '[.artifacts[] | select(.name == "tequiladash-xcode-ipa" and .expired == false)] | .[0].id // empty' \
              2>/dev/null || true)"
            if [ -z "${ART:-}" ]; then
              echo "run $RUN: 无「未过期」的 tequiladash-xcode-ipa artifact ⇒ 不可复用"
              continue
            fi
            rm -rf /tmp/reuse && mkdir -p /tmp/reuse
            if ! gh run download "$RUN" -n tequiladash-xcode-ipa -D /tmp/reuse >/dev/null 2>&1; then
              echo "run $RUN: artifact 下载失败 ⇒ 不可复用"
              continue
            fi
            # 双版本：一个 artifact 里有【两个】IPA（标准版 + 隧道版），全部收齐后一并发。
            # 不用 mapfile（macOS 自带 bash 3.2 无此内建）；用 while-read 填数组，兼容 3.2。
            IPAS=()
            while IFS= read -r f; do IPAS+=("$f"); done \
              < <(find /tmp/reuse -name 'TequilaDash-*.ipa' -type f | sort)
            HASHF="$(find /tmp/reuse -name 'promote-hash.txt' -type f | head -n1)"
            if [ "${#IPAS[@]}" -eq 0 ]; then
              echo "run $RUN: 产物里没有 IPA ⇒ 不可复用"; continue
            fi
            # 判据 2：产物必须携带 hash 标记（旧产物没有 ⇒ 无法确认 ⇒ 不复用）。
            if [ -z "${HASHF:-}" ]; then
              echo "run $RUN: 产物未携带 promote-hash.txt（旧产物）⇒ 无法确认 hash，不可复用"; continue
            fi
            CACHED_HASH="$(tr -d '[:space:]' < "$HASHF")"
            # 判据 3：hash 必须一致（保证产物确由这份源码编出）。
            if [ "${CACHED_HASH:-}" != "$CUR_HASH" ]; then
              echo "run $RUN: hash 不一致（cached=${CACHED_HASH:-空} current=$CUR_HASH）⇒ 不可复用"
              continue
            fi

            # ── 四条件全满足：复用 ──
            echo "=== 复用 run ${RUN} 的产物（同 SHA / success / artifact 未过期 / hash 一致），跳过编译 ==="
            REUSE=true
            TAG="${GITHUB_REF_NAME}"
            echo "复用产物中的 IPA（${#IPAS[@]} 个）: ${IPAS[*]}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG 已存在，仅追加/覆盖 asset"
              gh release upload "$TAG" "${IPAS[@]}" --clobber
            else
              gh release create "$TAG" \
                --title "TequilaDash $TAG (Xcode native)" \
                --notes "由 Xcode 原生工程（方案 A）构建的未签名 IPA（双版本）。**复用 run ${RUN} 的成功构建产物，未重复编译**。标准版 TequilaDash-<ver>-xcode-unsigned.ipa 仅需普通证书；隧道版 TequilaDash-Tunnel-<ver>-xcode-unsigned.ipa 随包携带 packet-tunnel-provider，需带 Network Extension 权限的证书/侧载工具给主 App 与扩展都施加 NE。侧载时由工具（Sideloadly/ESign/TrollStore）施加 entitlements。bundle id=com.tequila.dash。" \
                "${IPAS[@]}"
            fi
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "reuse_run=${RUN}" >> "$GITHUB_OUTPUT"
            ASSET_NAMES="$(for f in "${IPAS[@]}"; do basename "$f"; done | paste -sd ',' -)"
            { echo "### Promote 判定：已复用（跳过编译）"
              echo "- tag = \`${TAG}\`，commit = \`${SHA}\`"
              echo "- 复用 run [${RUN}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN}) 的成功产物"
              echo "- 源码 hash 一致：\`${CUR_HASH}\`"
              echo "- 已发布 Release \`${TAG}\`（asset = \`${ASSET_NAMES}\`）"; } >> "$GITHUB_STEP_SUMMARY"
            break
          done

          if [ "$REUSE" != "true" ]; then
            echo "未找到可安全复用的构建 ⇒ 正常编译。"
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            { echo "### Promote 判定：未复用（走正常构建）"
              echo "- tag = \`${GITHUB_REF_NAME}\`，commit = \`${SHA}\`"
              echo "- 原因：同 SHA 无 success run / artifact 缺失或已过期 / hash 不一致（任一不满足即重新构建）"; } >> "$GITHUB_STEP_SUMMARY"
          fi

  xcode-build:
    needs: [promote, guard]
    # promote 判定可复用时，整个构建 job 跳过（不重复编译）。
    # ⚠️ 必须显式写 !cancelled()：GitHub 会给「不含状态检查函数」的 if 隐式附加
    # success()。若只写 `needs.promote.outputs.reuse != 'true'`，一旦 promote 失败
    # （gh API 抖动 / runner 异常）本 job 会被隐式 success() 判假而【整体跳过】
    # ⇒ 既不构建也不发 Release，违背「宁可多编一次」。加上 !cancelled() 覆盖默认
    # success() 后：promote 失败 ⇒ reuse 输出为空 ⇒ 条件为真 ⇒ 照常构建出包；
    # 仅在 promote 成功且明确复用（reuse=true）时才跳过。
    # ⚠️ 另加 `needs.guard.result == 'success'`：guard 失败 ⇒ 本 job 跳过 ⇒ 绝不发版。
    #    必须加在**本 job**（而非只门控 promote）：本 job 末尾的 Publish Release 步骤
    #    自己也会发 Release；而上面的 !cancelled() 会覆盖「依赖被跳过 ⇒ 本 job 跳过」的
    #    默认行为 ⇒ 只门控 promote 的话，guard 失败时本 job 仍会跑并发版。
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.promote.outputs.reuse != 'true' }}
    runs-on: xcode-27
    env:
      UNICORN_TAG: "2.1.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore file mtimes (make DerivedData cache usable)
        # v0.3.85 关键修复：CI 每轮都重新 checkout，所有源文件 mtime = 当下 →
        # 比缓存里的编译产物还新，Xcode 判定全部过期，DerivedData 缓存等于失效。
        # 这里把每个文件的 mtime 设成「最后一次修改它的提交时间」：
        # 未改动的文件 → mtime 早于缓存产物 → 跳过重编；本轮改过的文件 → 提交时间最新 → 正常重编。
        run: |
          pip install git-restore-mtime 2>/dev/null || true
          if command -v git-restore-mtime >/dev/null; then
            git restore-mtime
            echo "=== mtime 已按提交历史恢复 ==="
          else
            echo "?? git-restore-mtime 不可用，回退到内置实现"
            git log --pretty=format:'%ct' --name-only --no-renames | awk '
              /^[0-9]+$/ { t=$1; next }
              NF>0 && t && !seen[$0]++ { print t "	" $0 }
            ' | while IFS=$'	' read -r ts f; do
              [ -e "$f" ] && touch -d "@$ts" "$f" 2>/dev/null || true
            done
            echo "=== mtime 已按提交历史恢复（内置实现）==="
          fi

      - name: Select Xcode (27 trial - prefer 27, fall back to 26)
        # Xcode 27 专用（原 `xcode27-trial` 分支的实验，现已合入 `migrate-xcode`）：
        #   runs-on 写 `xcode-27` —— 该镜像上只有 Xcode 27，没有 Xcode_26*.app。
        #   ⚠️ 别写成 `xcode-27-arm64`：那只是**镜像文件名**，写成 runs-on 会**永久排队**（踩过）。
        #   ⚠️ 注意 `set -e`：`ls` 没匹配时返回非 0 会直接中断脚本，所以每处都加 `|| true`。
        run: |
          set -euo pipefail
          pick() { ls -d /Applications/Xcode$1*.app 2>/dev/null | sort -V | tail -n1 || true; }
          XCODE_APP="$(pick _27)"
          if [ -z "$XCODE_APP" ]; then XCODE_APP="$(pick _26)"; fi
          if [ -z "$XCODE_APP" ]; then XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1 || true)"; fi
          echo "Selecting Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "=== 部署目标（应为 18.0，本试验的关键点）==="
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" project.yml || true

      - name: Install Metal Toolchain (Xcode 27 splits it out)
        # Xcode 27 实测结论（原 `xcode27-trial` 分支，现已合入 `migrate-xcode`）：
        #   Xcode 27 起 **Metal 工具链是单独下载的组件**，
        #   不装就会在编译阶段报：
        #     error: cannot execute tool 'metal' due to missing Metal Toolchain;
        #            use: xcodebuild -downloadComponent MetalToolchain
        #   我们仓库里有 `TequilaDash/Views/LiquidGlassOrb.metal`，所以这一步是**必需**的。
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          echo "=== 校验 metal 可用 ==="
          xcrun -f metal
          # ⚠️ 必须走 `xcrun metal`：`metal` 不在 PATH 上，直接调会 exit 127。
          xcrun metal --version

      - name: Install build tooling (xcodegen, cmake)
        # 本轨道出【未签名 IPA】：不调用 ldid，entitlements 随 .app 携带、交给侧载工具施加
        # （见「Package unsigned IPA」步骤）。
        # ldid 已从依赖里删除（2026-09-18）：全流程从不调用它，装着只是白装 ——
        #   将来要恢复签名才需要把它加回来。
        run: brew install xcodegen cmake

      - name: Cache SAP assets and Unicorn build
        # Asspp 本地 SAP 登录：Unicorn 源码/构建 + Apple SAP 资产（约 38MB）。
        # 不缓存的话每轮都要重新拉源码、编 Unicorn 并下载资产（多花好几分钟）。
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ipatool/sap/apple-assets-v2
            ~/Library/Developer/Xcode/DerivedData
          key: sap-${{ runner.os }}-${{ hashFiles('Resources/Scripts/prepare.sap.py') }}
          restore-keys: |
            sap-${{ runner.os }}-

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.cargo/env
          # v2 (2026-10-26): v1 那份缓存里 ~/.rustup 是半更新状态，恢复后 rustc 跑不起来、
          # rustup-init 又因残留目录重装失败。换 key 重新种一份。
          key: macos-rust-stable-v2

      - name: Install Rust toolchain
        # 2026-10-26 run 40309077726 实证：缓存恢复后 ~/.rustup 处于「半更新」状态，
        # rustup-init 在已有 toolchains/<host>/{share,share/man,share/doc,etc,share/zsh}
        # 残留目录上重装会整批报
        #   error: could not rename 'component' file from '.../tmp/xxx_dir/bk'
        #          to '.../toolchains/stable-aarch64-apple-darwin/share': Directory not empty (os error 66)
        # 然后 rollback，toolchain 直接不可用（后续 cargo 全挂）。
        # 判据从「~/.cargo/bin/rustc 是不是可执行文件」改成「rustc 能不能真跑」：
        # 跑得起来就只补 target，跑不起来就整块清掉重装，避免半更新状态继续传染缓存。
        run: |
          set -euo pipefail
          # 新 runner 镜像可能预置 CARGO_HOME/RUSTUP_HOME（如 /opt/homebrew/opt/rustup），
          # 会让我们装到 ~/.cargo 的 toolchain 不被后续步骤看到，这里显式清掉。
          unset CARGO_HOME RUSTUP_HOME || true
          if "$HOME/.cargo/bin/rustc" --version >/dev/null 2>&1; then
            echo "Rust 工具链可用，跳过安装：$("$HOME/.cargo/bin/rustc" --version)"
          else
            echo "Rust 工具链不可用，清理 ~/.rustup 与 ~/.cargo/bin 后重装"
            rm -rf "$HOME/.rustup" "$HOME/.cargo/bin" "$HOME/.cargo/env"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version

      - name: Cache Rust registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/idevice-ffi/target
            openssl-build/libcrypto.a
            openssl-build/include
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/idevice-ffi/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          scope: tequiladash-build-cache

      - name: Install sccache
        # 同上：仅当缺失时安装（Rust 走 artifact 缓存命中时根本用不到 sccache）
        run: |
          if command -v sccache >/dev/null; then
            echo "sccache 已存在，跳过 brew 安装"
          else
            brew install sccache || true
          fi
          sccache --version || true

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/sccache
          key: macos-sccache-v1
          scope: tequiladash-build-cache

      - name: Restore Rust FFI product (artifact, cross-run)
        # actions/cache 按 branch/tag scoping 隔离：本项目只有 tag 触发构建，
        # 上一个 tag 保存的缓存下一个 tag 永远 miss（日志实证：五步缓存全部
        # "Cache not found"，Rust 每轮全量重编 438 crates / 458s）。
        # artifact 没有 branch scoping：固定名 artifact 存最终产物 libidevice_ffi.a
        # + 源码 hash，hash 一致即跳过 cargo 全量编译（Rust 源码不常变）。
        id: rust_cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CUR_HASH=${{ hashFiles('rust/idevice-ffi/Cargo.toml', 'rust/idevice-ffi/Cargo.lock', 'rust/idevice-ffi/build.rs', 'rust/idevice-ffi/src/**', 'rust/idevice-ffi/*.h') }}
          echo "current rust/idevice-ffi hash: $CUR_HASH"
          HIT=false
          ART_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=tequiladash-rust-ffi-v1&per_page=100" \
            --jq "[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty" 2>/dev/null || true)"
          if [ -n "${ART_ID:-}" ]; then
            rm -rf /tmp/rust-ffi-cache && mkdir -p /tmp/rust-ffi-cache
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/rust-ffi-cache/cache.zip
            unzip -oq /tmp/rust-ffi-cache/cache.zip -d /tmp/rust-ffi-cache
            CACHED_HASH="$(cat /tmp/rust-ffi-cache/rust-hash.txt 2>/dev/null || true)"
            # zip 内路径随 upload paths 的 LCA 变化（v0.3.3 实锤：hash 相同却因
            # 固定路径 [-s] 检查失败判 stale）——用 find 容错定位。
            FOUND_A="$(find /tmp/rust-ffi-cache -name 'libidevice_ffi.a' -type f 2>/dev/null | head -n1)"
            if [ "${CACHED_HASH:-}" = "$CUR_HASH" ] && [ -n "$FOUND_A" ]; then
              mkdir -p rust-libs
              cp "$FOUND_A" rust-libs/libidevice_ffi.a
              HIT=true
              echo "=== Rust FFI cache HIT (skip cargo full build, from $FOUND_A) ==="
            else
              echo "=== Rust FFI cache stale (cached=${CACHED_HASH:-empty} current=$CUR_HASH) ==="
            fi
          else
            echo "=== Rust FFI cache artifact not found (first run or expired) ==="
          fi
          echo "hit=$HIT" >> "$GITHUB_OUTPUT"

      - name: Build libidevice_ffi.a (Rust, aarch64-apple-ios)
        # 从源码编出单 .a。idevice.h 拷贝与 xcframework
        # 组装移到「Assemble」步骤（缓存命中时也要执行）。
        # xcodebuild 编译 Tunnel/*.m 时需要该头，故必须在 generate/build 之前完成。
        if: steps.rust_cache.outputs.hit != 'true'
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          export RUSTC_WRAPPER="$(command -v sccache || true)"
          export SCCACHE_CACHE_SIZE=2G
          if [ -z "$RUSTC_WRAPPER" ]; then
            echo "sccache unavailable — falling back to plain cargo"
            unset RUSTC_WRAPPER
          fi
          export SDKROOT="$(xcrun -sdk iphoneos -show-sdk-path)"
          export CC_aarch64_apple_ios="$(xcrun -sdk iphoneos -f clang)"
          export CXX_aarch64_apple_ios="$(xcrun -sdk iphoneos -f clang++)"
          cd rust/idevice-ffi
          mkdir -p .cargo
          cat > .cargo/config.toml <<'CFG'
          [net]
          git-fetch-with-cli = true
          retry = 3

          [http]
          multipart = false
          CFG
          cd ../..
          cargo --version
          # 钉死 Rust FFI 的部署目标为 18.0，与 app 的 IPHONEOS_DEPLOYMENT_TARGET 对齐。
          # 否则 .a 默认按 SDK 版本(26.5)编，链接到 18.0 时会刷 ~191 条
          # "built for newer 'iOS' version (26.5) than being linked (18.0)" 的 linker 警告。
          export IPHONEOS_DEPLOYMENT_TARGET=18.0
          # tee 落盘：GitHub run log 偶发 421 取不到时，靠 artifact 拿真实报错（同 package.log 兜底思路）
          RUST_EXIT=0
          cargo build --release --target aarch64-apple-ios --manifest-path rust/idevice-ffi/Cargo.toml 2>&1 | tee /tmp/rust-build.log || RUST_EXIT=$?
          if [ "$RUST_EXIT" -ne 0 ]; then
            grep -E "^error|error\[|error:" /tmp/rust-build.log | head -30 | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
            exit "$RUST_EXIT"
          fi
          mkdir -p rust-libs
          cp "rust/idevice-ffi/target/aarch64-apple-ios/release/libidevice_ffi.a" rust-libs/libidevice_ffi.a
          # 记录产物对应的源码 hash（artifact 产物缓存的命中判据，供 Save 步骤打包）。
          # 显式列表：排除 .cargo/config.toml（Save 时已写、Restore 时未写，会让两个
          # hash 永远不相等——v0.3.2 首个验证 run 实锤 cached!=current）。
          echo "${{ hashFiles('rust/idevice-ffi/Cargo.toml', 'rust/idevice-ffi/Cargo.lock', 'rust/idevice-ffi/build.rs', 'rust/idevice-ffi/src/**', 'rust/idevice-ffi/*.h') }}" > rust-hash.txt

      - name: Assemble libidevice_ffi.xcframework
        # 无论 .a 来自 cargo 还是产物缓存，都要组装 xcframework + 拷编译期桥接头。
        run: |
          set -euo pipefail
          mkdir -p TequilaDash/Tunnel rust-libs
          # 方案 A #317：Rust FFI 以 xcframework 形式分发/链接（对齐 Asspp 做法）。
          # 注意：.a / .xcframework 必须落在 xcodegen source 树（TequilaDash/）之外，否则 xcodegen
          # 会把它们当资源拷贝进 .app bundle（实测 114MB .a 进包）。改走 framework 依赖链接。
          test -s rust-libs/libidevice_ffi.a
          xcodebuild -create-xcframework \
            -library rust-libs/libidevice_ffi.a \
            -headers rust/idevice-ffi/ \
            -output rust-libs/libidevice_ffi.xcframework
          # 编译期桥接头 idevice.h 仍需（HEADER_SEARCH_PATHS 引用 TequilaDash/Tunnel），保留副本
          cp "rust/idevice-ffi/idevice.h" TequilaDash/Tunnel/idevice.h
          ls -la rust-libs/libidevice_ffi.xcframework TequilaDash/Tunnel/idevice.h

      - name: Save Rust FFI product (artifact, cross-run)
        # 固定名 artifact：libidevice_ffi.a + rust-hash.txt。后续 run 源码未变即命中
        # Restore 步骤，458s 的 cargo 全量编译归零。
        if: steps.rust_cache.outputs.hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tequiladash-rust-ffi-v1
          path: |
            rust-libs/libidevice_ffi.a
            rust-hash.txt

      - name: Sync bundled modules from module-esc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 内置模块单一数据源：module-esc 仓库（modules/<id>/module.json）。
          # ⚠️ **哪些内置由模块自己声明**（module.json 的 `distribution: "bundled"`，
          # 默认 external = 独立模块走 edge zip 按需导入），**不在这里硬编码排除名单**。
          # 旧实现是 `cp -R modules/*` + 硬编码 `rm -rf .../com.tequila.alist`，
          # 于是 v0.3.481 新加的模块被自动打成了内置模块（而那个模块要求是独立的），
          # 而且每加一个不内置的模块都要回来改一次 workflow。规则与理由见
          # Resources/Scripts/sync_bundled_modules.py 的头注释。
          # v0.3.720：钉死 commit。module-esc 是内置模块的数据源，sync_bundled_modules.py
          # 会把 modules/<id>/ui/ 的 SwiftUI 源码拷进编译树，上游一次 push 就会改变发版
          # 二进制而本仓库零 diff、无法 bisect。同 workflow 的 AirLift 已用 AIRCARD_COMMIT
          # 钉死（Resources/Scripts/build-airlift-xcframework.sh:20），此处照抄同一做法。
          # 升级步骤：改 MODULE_ESC_COMMIT 后跑一次 CI，确认 BundledModules 清单符合预期。
          MODULE_ESC_REPO="https://github.com/EscapeOS/module-esc.git"
          MODULE_ESC_COMMIT="283155d17209ab184f664536ed407ee0124aeb48"
          git init -q _module-esc
          git -C _module-esc remote add origin "$MODULE_ESC_REPO"
          git -C _module-esc fetch --depth 1 origin "$MODULE_ESC_COMMIT"
          git -C _module-esc checkout -q --detach FETCH_HEAD
          echo "module-esc @ $(git -C _module-esc rev-parse HEAD)"
          python3 Resources/Scripts/sync_bundled_modules.py _module-esc
          rm -rf _module-esc
          echo "=== BundledModules ==="
          find Resources/BundledModules -name module.json

      - name: Build OpenSSL (libcrypto, ios arm64, cached)
        # v0.3.101：ZSign ad-hoc 重签名依赖 libcrypto。iphoneos-cross 无 asm 静态库。
        run: |
          set -euo pipefail
          if [ -f openssl-build/libcrypto.a ]; then
            echo "OpenSSL cache hit"; exit 0
          fi
          mkdir -p openssl-build && cd openssl-build
          curl -fsSLO https://www.openssl.org/source/openssl-3.3.2.tar.gz
          tar xf openssl-3.3.2.tar.gz
          cd openssl-3.3.2
          export CROSS_TOP="$(dirname "$(dirname "$(xcrun -sdk iphoneos -show-sdk-path)")")"
          export CROSS_SDK="$(basename "$(xcrun -sdk iphoneos -show-sdk-path)")"
          export CROSS_COMPILE=""
          ./Configure iphoneos-cross no-asm no-shared no-tests no-docs -DL_ENDIAN
          make -j"$(sysctl -n hw.ncpu)" build_libs
          cp libcrypto.a ../libcrypto.a
          mkdir -p ../include
          cp -r include/openssl ../include/
          cd ..
          rm -rf openssl-3.3.2 openssl-3.3.2.tar.gz
          ls -la libcrypto.a
          echo "=== OpenSSL built ==="

      - name: Restore AirliftFFI product (artifact, cross-run)
        # AirLift（AirTraffic 沙盒逃逸）的 Rust 库**不能** vendor 预编译产物：
        # AirBeep 仓库里提交的是**补丁前旧产物**（不含 al_exploit_read_file /
        # al_bytes_free / al_set_target_host）。故每轮从 AirCard-iOS（钉死 commit）+
        # 补丁现场编。为省时间，套用与 libidevice_ffi 同款的 artifact 缓存
        # （AirCard commit 由脚本钉死，补丁内容变化即 hash 变化 ⇒ 自动失效）。
        id: airlift_cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CUR_HASH=${{ hashFiles('Resources/Scripts/airlift-read-file.patch', 'Resources/Scripts/build-airlift-xcframework.sh') }}
          echo "current airlift hash: $CUR_HASH"
          HIT=false
          ART_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=tequiladash-airlift-ffi-v1&per_page=100" \
            --jq "[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty" 2>/dev/null || true)"
          if [ -n "${ART_ID:-}" ]; then
            rm -rf /tmp/airlift-cache && mkdir -p /tmp/airlift-cache
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/airlift-cache/cache.zip
            unzip -oq /tmp/airlift-cache/cache.zip -d /tmp/airlift-cache
            CACHED_HASH="$(cat /tmp/airlift-cache/airlift-hash.txt 2>/dev/null || true)"
            FOUND_DIR="$(find /tmp/airlift-cache -type d -name 'AirliftFFI.xcframework' 2>/dev/null | head -n1)"
            if [ "${CACHED_HASH:-}" = "$CUR_HASH" ] && [ -n "$FOUND_DIR" ]; then
              mkdir -p rust-libs
              rm -rf rust-libs/AirliftFFI.xcframework
              cp -R "$FOUND_DIR" rust-libs/AirliftFFI.xcframework
              HIT=true
              echo "=== AirliftFFI cache HIT (skip AirCard cargo build) ==="
            else
              echo "=== AirliftFFI cache stale (cached=${CACHED_HASH:-empty} current=$CUR_HASH) ==="
            fi
          else
            echo "=== AirliftFFI cache artifact not found (first run or expired) ==="
          fi
          echo "hit=$HIT" >> "$GITHUB_OUTPUT"

      - name: Build patched AirliftFFI.xcframework
        # clone AirCard-iOS（钉死 commit）→ 打 airlift-read-file.patch → build-ios.sh
        # （双 target cargo：aarch64-apple-ios / aarch64-apple-ios-sim）→ xcframework
        # 落到 rust-libs/（xcodegen source 树之外）。
        # 必须在 xcodegen generate **之前**完成，project.yml 的 framework 依赖才能解析。
        if: steps.airlift_cache.outputs.hit != 'true'
        run: |
          set -euo pipefail
          # 显式覆盖 DEVELOPER_DIR：AirCard 的 build-ios.sh 默认指向
          # /Applications/Xcode-beta.app（runner 上不存在）；脚本内
          # `${DEVELOPER_DIR:-...}` 尊重既有值 ⇒ 用 setup-xcode 选好的正式 Xcode。
          export DEVELOPER_DIR="${DEVELOPER_DIR:-$(xcode-select -p)}"
          bash Resources/Scripts/build-airlift-xcframework.sh
          echo "${{ hashFiles('Resources/Scripts/airlift-read-file.patch', 'Resources/Scripts/build-airlift-xcframework.sh') }}" > airlift-hash.txt

      - name: Verify AirliftFFI symbols
        # 无论产物来自缓存还是现场编译，都校验补丁符号在场
        # （防「拿补丁前旧产物当新产物」—— 这正是 AirBeep 仓库的坑）。
        run: bash Resources/Scripts/verify-airlift.sh

      - name: Save AirliftFFI product (artifact, cross-run)
        if: steps.airlift_cache.outputs.hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tequiladash-airlift-ffi-v1
          path: |
            rust-libs/AirliftFFI.xcframework
            airlift-hash.txt

      - name: Generate Xcode project (xcodegen)
        run: |
          set -euo pipefail
          echo "=== project.yml head ==="
          head -50 project.yml
          echo "=== xcodegen version ==="
          xcodegen version
          echo "=== xcodegen generate ==="
          xcodegen generate 2>&1 | tee /tmp/xcodegen.log
          echo "=== generated files ==="
          ls -la TequilaDash.xcodeproj/ 2>/dev/null || true

      - name: Compute cache key (sources + project structure)
        id: src_hash
        # ⚠️ project.yml 必须**剔除版本号行**再哈希：每轮发版都会改
        # MARKETING_VERSION/CURRENT_PROJECT_VERSION，若直接哈希整个文件，
        # 缓存 key 每轮都变 → DerivedData 缓存永远 miss（v0.3.82 修复）。
        run: |
          set -euo pipefail
          SRC_HASH="$(find TequilaDash TequilaDashTunnel -type f \( -name '*.swift' -o -name '*.m' -o -name '*.mm' \
            -o -name '*.c' -o -name '*.h' \) -print0 2>/dev/null \
            | sort -z | xargs -0 shasum -a 256 2>/dev/null | shasum -a 256 | cut -d' ' -f1)"
          PROJ_HASH="$(grep -v -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION|Version:' project.yml \
            | shasum -a 256 | cut -d' ' -f1)"
          echo "hash=${SRC_HASH:-nosrc}-${PROJ_HASH:-noproj}" >> "$GITHUB_OUTPUT"

      - name: Cache DerivedData (incremental Swift build)
        # v0.3.81 引入：Swift 源码未变时直接复用 build/，编译从全量变增量。
        # key 只由「源码内容 + 工程结构（去版本号）」决定，发版改号不会击穿缓存。
        uses: actions/cache@v4
        with:
          path: build/Build/Intermediates.noindex
          key: macos-deriveddata-${{ steps.src_hash.outputs.hash }}

      - name: Build (compile/link, no Apple signing)
        # 验证「当前源码能在 Xcode 原生工程下编过」并产出未签名 .app。
        # CODE_SIGNING_ALLOWED=NO 跳过 Apple 证书签名要求；entitlements 随 .app 携带、
        # 由侧载工具施加（**本轨道不调用 ldid**，见「Package unsigned IPA」步骤）。
        # -derivedDataPath build 把 .app 固定落到 build/Build/Products/Release-iphoneos/，
        # 便于打包步骤稳定定位（默认 DerivedData 路径含随机 hash，不可预测）。
        # DEBUG_INFORMATION_FORMAT=dwarf：CI 出的是未签名测试包，不需要单独 dSYM
        # 产物，省掉 dSYM 生成/拷贝这一大块链接后处理时间（v0.3.81）。
        run: |
          set -euo pipefail
          # v0.3.272：失败时把具体编译错误行转成 ::error:: annotation——匿名 API
          # 只能读 annotations 读不到 job log，此前 CI 失败只能盲猜.
          XCB_EXIT=0
          xcodebuild build \
            -project TequilaDash.xcodeproj \
            -scheme TequilaDash-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            DEAD_CODE_STRIPPING=NO \
            2>&1 | tee /tmp/xcodebuild.log || XCB_EXIT=$?
          if [ "$XCB_EXIT" -ne 0 ]; then
            grep -E "error:" /tmp/xcodebuild.log | head -30 | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
            exit "$XCB_EXIT"
          fi
          echo "Xcode build (compile/link) succeeded"
          echo "Xcode build (compile/link) succeeded"
          echo "=== app 体积 ==="
          du -sh build/Build/Products/Release-iphoneos/TequilaDash.app 2>/dev/null || true
          echo "=== located app bundles ==="
          find build -name 'TequilaDash.app' -type d || true

      - name: Package unsigned IPA
        # 打包形态与 Theos 轨道对齐（Payload/TequilaDash.app），但**不调用 ldid**：
        # 出的是【未签名 IPA】，entitlements 文件随 .app 携带（理由见本步骤末尾的说明）。
        # → 打包为 Payload/TequilaDash.app → zip 成未签名 IPA（不依赖 Apple 证书）。
        # 全程诊断输出 tee 到 /tmp/package.log，并由「Upload package log」artifact 落盘，
        # 即使本步骤失败也能拿到真实错误（GitHub run log 偶发 421 取不到时作为兜底）。
        run: |
          set -euo pipefail
          exec > >(tee /tmp/package.log) 2>&1
          echo "=== packaging start ($(date -u)) ==="

          APP="$(find build -name 'TequilaDash.app' -type d | head -n1)"
          echo "APP=$APP"
          if [ -z "$APP" ]; then
            echo "ERROR: TequilaDash.app not found under build/"
            find build -maxdepth 5 -name '*.app' -type d 2>/dev/null || true
            exit 1
          fi
          ls -la "$APP"

          # 取 .app 内真实可执行文件名（避免硬编码 PRODUCT_NAME 与实际不符）
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" 2>/dev/null)"
          if [ ! -f "$BIN" ]; then
            # 回退：直接用 PRODUCT_NAME
            BIN="$APP/TequilaDash"
          fi
          echo "BIN=$BIN"
          ls -la "$BIN"

          # 按用户「产物不签名」要求，Xcode 轨道出【未签名 IPA】：不调用 ldid
          # （brew 版 ldid 在 CI 上对主二进制 assert 崩溃 ldid.cpp(852)，且用户明确产物不需签名）。
          # 把 entitlements 文件随 .app 携带，供侧载工具（Sideloadly/ESign/TrollStore）施加。
          #
          # ── 双版本（方案 A）：一次编译、两份打包 ──
          # 两版的【编译产物逐字节相同】，唯一差别是随包携带的 entitlements 文件：
          #   · 标准版 → TequilaDash.entitlements（无 NE 权限，免费/企业证书可签）
          #   · 隧道版 → TequilaDash-Tunnel.entitlements（含 packet-tunnel-provider）
          #             且扩展 .appex 内也携带自己的 NE entitlements（否则隧道起不来）
          # 故无需第二次 xcodebuild，只需对同一份 .app 用不同 entitlements 各打一次包。

          echo "=== lipo -info ==="
          lipo -info "$BIN" 2>/dev/null || true

          # 精确匹配 settings.base 内的 MARKETING_VERSION 行（排除头部注释里的同名词，
          # 否则 grep -m1 会命中注释行，版本号变成乱码导致 zip 文件名含空格而失败）
          VERSION="$(grep -m1 '^[[:space:]]*MARKETING_VERSION:' project.yml | sed -E 's/.*"([0-9.]+)".*/\1/')"
          STD_IPA="TequilaDash-${VERSION}-xcode-unsigned.ipa"
          TUN_IPA="TequilaDash-Tunnel-${VERSION}-xcode-unsigned.ipa"
          APPEX="$(find "$APP" -name 'TequilaDashTunnel.appex' -type d | head -n1)"
          echo "APPEX=${APPEX:-<未找到>}"

          # 打包当前 $APP 为未签名 IPA（标准 Payload/ 布局，与 Theos 出包一致）。
          # 必须从 Payload 目录的【外层】打包，使 IPA 根目录为 Payload/TequilaDash.app/...
          # （不可 cd Payload 内再 zip，否则 IPA 缺 Payload/ 包裹，无法按标准安装）。
          # 用 cp -R 而非 mv：同一份 .app 要打两次（标准/隧道），不能在第一版后移走。
          package_ipa() {
            rm -rf Payload && mkdir Payload
            cp -R "$APP" Payload/
            zip -r "$1" Payload
            ls -la "$1"
          }

          # ── 标准版 ──
          cp TequilaDash.entitlements "$APP/TequilaDash.entitlements" 2>/dev/null || true
          echo "producing UNSIGNED standard IPA"
          package_ipa "$STD_IPA"

          # ── 隧道版 ──
          # 主 App 随包 entitlements 覆盖为隧道版（含 networkextension）。
          # 标准版 Payload 副本在上一步已生成，此处覆盖不会污染它。
          cp TequilaDash-Tunnel.entitlements "$APP/TequilaDash.entitlements" 2>/dev/null || true
          # ★ 最容易漏：扩展 .appex 也必须携带自己的 NE entitlements，否则侧载工具
          #   不知道给扩展施加 packet-tunnel-provider，隧道无法建立。
          if [ -n "${APPEX:-}" ]; then
            cp TequilaDashTunnel/TequilaDashTunnel.entitlements "$APPEX/TequilaDashTunnel.entitlements" 2>/dev/null || true
          else
            echo "::warning::TequilaDashTunnel.appex 未找到 —— 隧道版扩展可能无法启用"
          fi
          echo "producing UNSIGNED tunnel IPA"
          package_ipa "$TUN_IPA"

          echo "IPA=$STD_IPA" >> "$GITHUB_ENV"
          echo "IPA_TUNNEL=$TUN_IPA" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodegen-and-build-logs
          path: |
            /tmp/xcodegen.log
            /tmp/xcodebuild.log
            /tmp/rust-build.log

      - name: Upload package log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-package-log
          path: /tmp/package.log

      - name: Verify SAP assets inside IPA
        # 本地 SAP 登录依赖 bundle 内 SAPAssets —— 缺了登录必然失败（invalidConfiguration）。
        # 双版本：两个 IPA 都要校验；unzip 一次只吃一个归档，故按 glob 逐个循环
        # （原先 `unzip -l TequilaDash-*.ipa` 会展开成两个文件参数而报错）。
        run: |
          set -euo pipefail
          ls -la TequilaDash-*.ipa
          for IPA in TequilaDash-*.ipa; do
            echo "=== verify $IPA ==="
            unzip -l "$IPA" | grep -E "SAPAssets/(CommerceKit|CoreFP)" || {
              echo "::error::SAPAssets 缺失于 $IPA —— Apple ID 登录会失败"; exit 1; }
          done
          # 隧道版必须真的带上含 NE 权限的 entitlements（主 App + 扩展各一份）
          if [ -f "${IPA_TUNNEL:-}" ]; then
            unzip -p "$IPA_TUNNEL" 'Payload/TequilaDash.app/TequilaDash.entitlements' \
              | grep -q 'com.apple.developer.networking.networkextension' || {
                echo "::error::隧道版主 App entitlements 缺 NE 权限"; exit 1; }
            unzip -p "$IPA_TUNNEL" 'Payload/TequilaDash.app/PlugIns/TequilaDashTunnel.appex/TequilaDashTunnel.entitlements' \
              | grep -q 'com.apple.developer.networking.networkextension' || {
                echo "::error::隧道版扩展 entitlements 缺 NE 权限"; exit 1; }
            echo "tunnel entitlements OK (app + appex)"
          fi

      - name: Write promote hash marker
        # 把「本次产物对应的源码 hash」随 IPA artifact 一起上传：tag 触发的 promote job
        # 靠它校验「同 SHA 复用」时的 hash 一致（见 promote job）。git ls-tree 只读提交树，
        # 不受本 job 之前/之后对工作区的任何改动影响，故两个 job 算出的值可比。
        run: |
          set -euo pipefail
          # 与 promote job 共用同一脚本，杜绝两份实现再次分叉（详见脚本头注释）。
          bash Resources/Scripts/promote_hash.sh > promote-hash.txt
          echo "promote-hash: $(cat promote-hash.txt)"
          echo "纳入 hash 的输入文件数: $(bash Resources/Scripts/promote_hash.sh --list)"

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tequiladash-xcode-ipa
          path: |
            TequilaDash-*.ipa
            promote-hash.txt


      - name: Publish Release (on tag)
        # 仅在打 v* tag 时发布 Release 并上传未签名 IPA 作为 asset。
        # migrate-xcode 现为本项目默认出包分支：开发在 migrate-xcode，打 tag 即出包。
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${IPA:-}" ] || [ ! -f "${IPA:-}" ]; then
            echo "IPA 未产出，跳过 Release 发布"; exit 0
          fi
          # 双版本：收集本次产出的全部 IPA（标准版 + 隧道版），逐个上传为 asset。
          ASSETS=("$IPA")
          if [ -n "${IPA_TUNNEL:-}" ] && [ -f "${IPA_TUNNEL:-}" ]; then
            ASSETS+=("$IPA_TUNNEL")
          fi
          echo "将上传 asset: ${ASSETS[*]}"
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，仅追加/覆盖 asset"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "TequilaDash $TAG (Xcode native)" \
              --notes "由 Xcode 原生工程（方案 A）构建的未签名 IPA（双版本）。标准版 TequilaDash-<ver>-xcode-unsigned.ipa 仅需普通证书；隧道版 TequilaDash-Tunnel-<ver>-xcode-unsigned.ipa 随包携带 packet-tunnel-provider，需带 Network Extension 权限的证书/侧载工具给主 App 与扩展都施加 NE。侧载时由工具（Sideloadly/ESign/TrollStore）施加 entitlements。bundle id=com.tequila.dash。" \
              "${ASSETS[@]}"
          fi
