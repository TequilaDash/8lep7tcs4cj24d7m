# xcodegen spec — TequilaDash Xcode 原生工程（方案 A 双轨迁移脚手架）
#
# 设计原则（来自 _build/THEOS-MIGRATION-ASSESSMENT.md）：
#   1. **本文件是唯一的构建定义。** Theos 轨道（Makefile / control / build.yml / mha-build.yml）
#      已于 2026-09-18 整体删除，只剩 Xcode 这一条轨道。
#   2. 单 module 行为：app + vendor(BitByteData/SWCompression/ApplePackage)
#      全部编进同一个 target（app 侧无 `import ApplePackage`）。
#      ApplePackage 于 v0.2.161 随 App Store 下载功能移除，v0.4.0 恢复并接入 SAP 签名。
#   3. 版本号纪律：MARKETING_VERSION / CURRENT_PROJECT_VERSION 需与 Resources/Info.plist
#      的 CFBundleShortVersionString / CFBundleVersion 一致（**只有这两处**，见 docs/releasing.md）。
#   4. 本机（Windows）无法跑 xcodebuild，本 spec 仅保证语法正确；真实编译由 macos-latest CI 验证。
#
# 用法（CI 内）：xcodegen generate  →  产出 TequilaDash.xcodeproj

name: TequilaDash

options:
  bundleIdPrefix: com.tequila
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4
  usesTabs: false

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.tequila.dash
    PRODUCT_NAME: TequilaDash
    MARKETING_VERSION: "0.3.658"
    CURRENT_PROJECT_VERSION: "958"
    # 注：这里**刻意不写** `SWIFT_VERSION` —— 实测顶层 `settings.base` 的它**不被 xcodegen 采纳**，
    # 真正生效的是下面 target 层那一份（当前 `"6.0"` = Swift 6 语言模式）。
    # 另注：**编译器版本 ≠ 语言模式** —— CI 用 Xcode 27 自带的 Swift 6.4 编译器，
    # 按这里 target 层的 6.0 语言模式编译。
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # 对齐 Theos：不把 Swift 运行时打进 .app（iOS 18+ 系统自带 Swift 5 ABI 稳定，
    # 嵌入反而需要额外对 Frameworks 内 dylib 签名）。单 module 应用无需嵌入。
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "NO"
    CLANG_ENABLE_MODULES: "YES"
    # 对齐 Theos 的 -I 搜索路径（桥接头引用 bad_query.h / Tunnel/*.h / MCM/*.h）
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/TequilaDash"
      - "$(SRCROOT)/TequilaDash/Engine"
      - "$(SRCROOT)/TequilaDash/Tunnel"
      # ZSign 引擎（v0.3.101）+ CI 预编译的 OpenSSL 头文件
      - "$(SRCROOT)/ZSign"
      - "$(SRCROOT)/ZSign/common"
      - "$(SRCROOT)/openssl-build/include"
      # Asspp 本地 SAP 登录：unicorn 头由 prepare.sap.py 生成在 DERIVED_FILE_DIR/SAP 下
      - "$(DERIVED_FILE_DIR)/SAP/source/include"
    # 对齐 Theos 的 LDFLAGS：系统 framework。
    # Rust FFI（libidevice_ffi）自 #317 起改以 xcframework 形式分发，由下方 target
    # dependencies 的 framework 依赖链接（不再走 LIBRARY_SEARCH_PATHS + -lidevice_ffi）。
    OTHER_LDFLAGS:
      - "-lresolv"
      - "-framework Security"
      - "-framework Network"
      # 内置隧道（v0.3.586）：NETunnelProviderManager 走 NetworkExtension.
      # 显式列出以对齐其余 framework 的写法（Swift 自动链接本也会加，列出更稳）.
      - "-framework NetworkExtension"
      - "-framework SystemConfiguration"
      - "-framework QuickLook"
      - "-framework PDFKit"
      - "-framework AVKit"
      - "-framework AVFoundation"
      - "-framework CoreLocation"
      - "-framework CryptoKit"
      # ZSign（v0.3.101）：ad-hoc 重签名依赖 libcrypto（CI 预编译 iOS arm64 静态库）
      - "-L$(SRCROOT)/openssl-build"
      - "-lcrypto"
      # Asspp 本地 SAP 登录：静态链接 Unicorn TCI 解释器（无 dylib、无需嵌入）
      - "$(DERIVED_FILE_DIR)/SAP/lib/libunicorn.a"
      - "-lc++"
      # 禁用 compact unwind 表。
      # 根因：TequilaDash 同时链接两个 Rust 静态库（libidevice_ffi.a +
      # libairlift_ffi.a），二者各带一份 `_rust_eh_personality`；加上 ObjC 的
      # `___objc_personality_v0` 与 C++ 的 `___gxx_personality_v0`，超过 ld64
      # compact unwind 能编码的 4 个上限，报：
      #   ld: Too many personality routines for compact unwind to encode.
      # 注：libairlift_ffi.a 已由 build-airlift-xcframework.sh 的
      # localize_airlift_symbols() 把非 `_al_` 全局符号降级为 local（那解决的是
      # 1032 个 duplicate symbols），但 personality routine 是**链接期**由两个
      # 库各自的 unwind 段提供的，本地化管不到。
      # -no_compact_unwind 让 ld 不生成该表，改用 DWARF unwind 信息，
      # 异常/栈展开行为不变，仅二进制略大。
      - "-Wl,-no_compact_unwind"
    SWIFT_OBJC_BRIDGING_HEADER: "TequilaDash/Engine/TequilaDash-Bridging-Header.h"
    # SapMachine.cpp 用了 std::format → 必须 C++20（原分叉同理）
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.8.0

targets:
  TequilaDash-iOS:
    type: application
    platform: iOS
    # 方案 A #317：Rust FFI 以 xcframework 形式链接（静态库，无需 embed/runpath）。
    # xcodegen 通过 framework 依赖类型引用 .xcframework（xcodegen 无独立 xcframework 类型）。
    # rust-libs/libidevice_ffi.xcframework 由 build-xcode.yml 在 xcodegen generate 之前生成。
    dependencies:
      - package: Citadel
      - framework: rust-libs/libidevice_ffi.xcframework
        embed: false
        link: true
      # AirLift（AirTraffic 沙盒逃逸，CVE-2026-43689）：Rust `libairlift_ffi.a` 以
      # xcframework 形式链接（静态库，无需 embed/runpath）。**不是**预编译 vendor ——
      # 由 Resources/Scripts/build-airlift-xcframework.sh 在 xcodegen 之前从
      # AirCard-iOS（钉死 commit）+ airlift-read-file.patch 现场编出（见 build-xcode.yml），
      # 并由 verify-airlift.sh 校验补丁符号（al_exploit_read_file / al_bytes_free /
      # al_set_target_host / al_exploit_write_dir）。落在 rust-libs/（xcodegen source 树之外），
      # 避免 .a 被当资源拷进 .app。
      - framework: rust-libs/AirliftFFI.xcframework
        embed: false
        link: true
      # 内置隧道扩展（Phase 2）：作为 App Extension 嵌入主 App 的 PlugIns/.
      # embed 默认为 true（依赖方是 application），显式写出以自证意图；XcodeGen 会据此
      # 生成 "Embed App Extensions" 阶段，把 TequilaDashTunnel.appex 拷进 TequilaDash.app/PlugIns/.
      - target: TequilaDashTunnel
        embed: true
    sources:
      # 模块原生 UI 源码（生成目录，见 TequilaDash/Modules/README.md）——
      # 由 Resources/Scripts/sync_bundled_modules.py 在 xcodegen **之前**从
      # module-esc 仓库拷进来. **不要**再单独列 ：
      # 这一行是递归的，已经包含它；重复列会让同一批文件被编两次 ⇒ 重复符号.
      - path: TequilaDash
        # v0.3.508：排除所有 README.md —— 它们只是文档，但会被当资源拷进
        # .app 根目录；两个同名 README 直接报
        # 「Multiple commands produce .../TequilaDash.app/README.md」。
        excludes:
          - "**/README.md"
      # ZSign 引擎（LC 同款签名器，v0.3.101：ad-hoc 重签名可拆卸 dylib 模块）
      - path: ZSign
        # 排除 README.md：它会平铺进 .app 根，与其它 source 的 README.md 撞车
        # （Multiple commands produce .../TequilaDash.app/README.md）
        excludes:
          - "**/README.md"
      - path: Resources
        # 把 Resources/ 内资源（AppIcon PNG、Supervised 的 .mobileconfig、solarium.jpg 等）
        # 打进 .app bundle。此前漏把 Resources/ 纳入 xcodegen source 树，导致切到 Xcode 后
        # 应用图标与这些资源全部缺失（Theos 会自动打包 Resources/）。
        # 排除 Info.plist：它已作为 INFOPLIST_FILE 被 xcodegen 处理；若再当资源拷贝进 bundle，
        # 会与生成的 Info.plist 冲突（Multiple commands produce Info.plist）。
        # 排除 BundledModules：模块清单都以 module.json 命名，平铺进 bundle 根会互相冲突，
        # 改用下方 folder reference（蓝色文件夹）保留目录结构。
        # 排除 I4Mobile：内嵌的爱思移动端 IPA 改用下方 folder reference 保留
        # `I4Mobile/<name>.ipa` 层级（运行时按目录读取；平铺到 bundle 根既乱又易重名）。
        excludes:
          - "Info.plist"
          - "BundledModules"
          - "I4Mobile"
          # 脚本与许可证由 prepare.sap.py 处理（许可证它自己拷进 bundle/SAPAssets），
          # 不再作为普通资源重复打包
          - "Scripts"
          - "Licenses"
          # 排除 README.md：Resources/README.md 会平铺进 .app 根，与 TequilaDash/ 下
          # 的 README.md 撞车（Multiple commands produce .../TequilaDash.app/README.md）
          - "**/README.md"
      - path: Resources/BundledModules
        # v0.3.48：内置模块清单，folder reference 保留 <id>/module.json 层级，
        # 运行时经 Bundle.main.url(forResource: "BundledModules", withExtension: nil) 读取。
        type: folder
        buildPhase: resources
      - path: Resources/I4Mobile
        # v0.3.585：爱思移动端内嵌 IPA（217 / 220 / photo）——「安装爱思移动端」的移植材料。
        # folder reference 保留 `I4Mobile/<name>.ipa` 层级，运行时经
        # Bundle.main.url(forResource: "I4Mobile", withExtension: nil) 定位后拼文件名读取。
        # 注：IPA 本体被 .gitignore 的 `*.ipa` 忽略，需在打包前物理放入该目录（见其 README.md）。
        type: folder
        buildPhase: resources
      - path: vendor/BitByteData/Sources
        # 排除 vendor 占位 PrivacyInfo.xcprivacy：两份内容完全相同且都在 Sources 根目录，
        # xcodegen 会把二者都复制进 app bundle 导致 "Multiple commands produce .../PrivacyInfo.xcprivacy"。
        # 用 xcodegen 正确的 excludes 键（注意不是 excluding/including！）按 glob 排除；
        # Theos 本也不把 Sources 内 .xcprivacy 自动打包，行为与 Theos 一致。
        excludes:
          - "**/PrivacyInfo.xcprivacy"
      - path: vendor/SWCompression/Sources
        excludes:
          - "**/PrivacyInfo.xcprivacy"
      # ApplePackage（移植自 asspp）：账号模型 / 搜索 / 清单 / 下载 / 历史版本。
      # v0.3.312 起 Apple ID 登录实现（连同 Go 侧 SAP 桥 sapbridge/）已整体移除，
      # 待按 CloudOfEquality/Asspp 分叉的本地 SAP 方案重新接入；本库继续提供
      # 账号模型与下载侧能力，故保留。
      # 全部 .swift 编进同一 target（单 module，无 import）。
      - path: vendor/ApplePackage
        excludes:
          - "**/PrivacyInfo.xcprivacy"
          # 同 Resources/ZSign：README.md 平铺进 .app 根会互相撞车
          - "**/README.md"
    settings:
      base:
        # Swift 6 语言模式迁移（原 `swift6-migration` 分支，2026-09-18 已合入 `migrate-xcode`）。
        #   ⚠️ 必须写在 **target** 这一层：实测顶层 `settings.base` 的 SWIFT_VERSION **不被 xcodegen 采纳**。
        #   只作用于本 target，**不会**波及 SwiftPM 依赖（Citadel / swift-crypto 等）。
        #   ⚠️ 刻意**不开** `SWIFT_APPROACHABLE_CONCURRENCY` / `SWIFT_DEFAULT_ACTOR_ISOLATION`：
        #     实测三档对照 —— 基线 134 处；只开易用并发仍是 134（零效果）；
        #     开默认 MainActor 隔离反而涨到 336（把引擎层的 nonisolated 代码全变成跨 actor 错误）。
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # 实测项（2026-09-18 第 6 轮）：对**完整**错误集重测「易用并发」。
        #   此前三档对照（134/336/134）是在**残缺**错误集上测的（编译提前中止），结论作废。
        #   SE-0461 NonisolatedNonsendingByDefault 正是用来减少 sending 诊断的。
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        # 直接复用仓库已有的 Info.plist 与 entitlements（与 Theos 行为一致），
        # 不走 xcodegen 的 Plist 生成（避免覆盖现有文件 / 缺 properties 解析失败）。
        # 注：xcodegen 的 info/entitlements 是 Plist 类型，要求 path+properties 子键，
        # 这里改为用 build setting 直接引用现有文件，绕过该限制。
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TequilaDash.entitlements
    preBuildScripts:
      # Asspp 本地 SAP 登录（v0.3.323）：拉 Unicorn 源码 + 4 个 Apple SAP 资产，
      # 编出 libunicorn.a 并把 SAPAssets 拷进 bundle。必须在 Link 之前完成。
      - name: Prepare SAP
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 "${SRCROOT}/Resources/Scripts/prepare.sap.py"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/SAP/lib/libunicorn.a"
          - "$(DERIVED_FILE_DIR)/SAP/source/include/unicorn/unicorn.h"

  # 内置隧道扩展（Phase 2）：一个「回环反射器」Packet Tunnel Provider.
  # 语义与设计见 TequilaDashTunnel/PacketTunnelProvider.swift 头注释，以及简报
  # 「调研_VPN权限检测与内置隧道.md」§2.1–§2.2.
  #
  # ⚠️ 本 target **不改变默认签名**：默认构建（TequilaDash.entitlements）不含 NE 权限，
  #    免费账号照旧可签主 App；本扩展的 entitlements（packet-tunnel-provider）只在做
  #    「隧道版」签名时才施加（免费账号签不了，见调研简报 §2.3）. CI 以
  #    CODE_SIGNING_ALLOWED=NO 编译验证，产物 .appex 供隧道版侧载签名使用.
  TequilaDashTunnel:
    type: app-extension
    platform: iOS
    sources:
      # 只收本目录；扩展源码**不在** TequilaDash/ 下，故不会被主 App target 重复编译.
      - path: TequilaDashTunnel
    settings:
      base:
        # Network Extension 要求扩展 bundle id 以主 App bundle id 为前缀；
        # 这里取主 bundle id + ".tunnel"，与 BuiltInTunnel.providerBundleID 的约定一致.
        PRODUCT_BUNDLE_IDENTIFIER: com.tequila.dash.tunnel
        PRODUCT_NAME: TequilaDashTunnel
        # 版本号三处同步（HARD-RULES 22）：主 App 的 settings.base 与 Resources/Info.plist 之外，
        # 扩展 target 是第三处 —— 原先这里停在 0.3.587/881（落后主 App 33 个版本），
        # 会让 .appex 的 CFBundleVersion 与主 App 不一致，iOS 安装/升级可拒或把扩展判过期。
        MARKETING_VERSION: "0.3.658"
        CURRENT_PROJECT_VERSION: "958"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        # 与主 target 同口径的 Swift 6 严格并发（详见主 target 的说明）.
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        INFOPLIST_FILE: TequilaDashTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: TequilaDashTunnel/TequilaDashTunnel.entitlements
        # 扩展只用到 NetworkExtension，显式链接（对齐主 target 的写法）.
        OTHER_LDFLAGS:
          - "-framework NetworkExtension"
